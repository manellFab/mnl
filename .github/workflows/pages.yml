name: CI/CD - Validate and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check index.html exists and is valid
        run: |
          test -s index.html
          grep -qi "<!DOCTYPE html>" index.html
          grep -q "</html>" index.html
      - name: No external script or style resources
        run: "! grep -nE '<script[^>]+src=|<link[^>]+href=.https?://' index.html"
      - name: No secrets committed
        run: "! grep -rnIE 'BEGIN .*PRIVATE KEY|ghp_[A-Za-z0-9]{20}|github_pat_|AKIA[0-9A-Z]{16}' --exclude-dir=.git --exclude-dir=.github ."

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage site
        run: mkdir _site && cp index.html _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
